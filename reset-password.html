<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password — Stackly</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="auth.css"><script defer src="main.js"></script><script defer src="cart.js"></script><script defer src="wishlist.js"></script><script defer src="auth.js"></script></head>
<body><div id="site-header"></div><main class="auth-main"><section class="auth-card recovery-card"><div class="recovery-icon">✦</div><span class="eyebrow">SET A NEW PASSWORD</span><h1>Reset password</h1><p class="auth-intro">Choose a strong password you haven't used before.</p><form id="reset-form"><label>New password<span class="password-wrap"><input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><button class="password-toggle" type="button" aria-label="Show password">Show</button></span></label><p class="password-hint">Use at least 8 characters.</p><label>Confirm new password<span class="password-wrap"><input type="password" name="confirm" required minlength="8" autocomplete="new-password" placeholder="Re-enter your password"><button class="password-toggle" type="button" aria-label="Show password">Show</button></span></label><button class="button button-orange auth-submit" type="submit">Reset password</button><p class="form-message" role="status"></p></form><p class="auth-bottom"><a href="signin.html">Back to Sign In</a></p><p class="demo-note">Password changes are saved in this browser only.</p></section></main><div id="site-footer"></div></body></html>
